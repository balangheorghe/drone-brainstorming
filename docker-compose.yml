services:
  veghe:
    build: .
    image: veghe:latest
    container_name: veghe
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    # Pagina de stare doar pe localhost-ul serverului (vedeți-o prin tunel SSH, nu o expuneți)
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
