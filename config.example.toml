# Alte fluxuri de adăugat după ce le verificați cu check-sources (Docker: `docker compose run --rm veghe check-sources`):
# [[sources.rss]]
# name = "zdg"                  # ZdG (WordPress?) – URL neconfirmat
# url = "https://www.zdg.md/feed/"
# role = "md_news"
# keywords = ["dron", "spatiul aerian", "spațiul aerian"]

[sources.adsb]                   # trafic aerian; nimic din ce se trimite nu identifică o aeronavă
enabled = true
interval = 60                    # 30 ar îmbunătăți detecția așteptărilor/întoarcerilor (minim 30)
url_template = "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}"   # raza se trimite ca întreg (≤ 250 NM)
# Surse de rezervă, același format, folosite doar dacă prima nu răspunde (1 cerere/s, uz necomercial):
fallback_templates = ["https://api.airplanes.live/v2/point/{lat}/{lon}/{radius}"]
min_request_gap_s = 1.1          # pauză minimă între cereri către același server
# Cheia adsb.lol (ADSBLOL_API_KEY în .env) se trimite doar dacă e setată.
#
# Receptor propriu (opțional; vedeți docs/13, „Receptor ADS-B propriu”). OBLIGATORIU readsb cu --db-file,
# altfel militarii nu pot fi deosebiți și analiza pe aeronavă se oprește (acoperire „fara_db”):
# local_url = "http://127.0.0.1:8042/?circle={lat},{lon},{radius}&jv2"
# local_points = ["LRIA Iași"]   # zonele citite din receptorul propriu (restul din agregatorul public)
control_point = "control"        # zonă largă de control: deosebește o pană de date de o scădere reală
points = [
  { name = "control", lat = 46.6, lon = 24.6, radius_nm = 120 },     # Transilvania: departe de Prut și de Marea Neagră
  { name = "LUKK Chișinău", lat = 46.928, lon = 28.931, radius_nm = 40 },
  { name = "LRIA Iași", lat = 47.178, lon = 27.621, radius_nm = 30 },
  { name = "LRSV Suceava", lat = 47.688, lon = 26.354, radius_nm = 30 },
  { name = "LRBC Bacău", lat = 46.522, lon = 26.910, radius_nm = 30 },
]
# Aeronave MILITARE din datele publice: doar un rezumat (tip general, ~distanță, direcție), DOAR în grupul
# privat; nu se păstrează identități sau trasee. Nu redistribuiți pozițiile. Pentru oprire: enabled = false.
military = { enabled = true, name = "Iași 150 NM", lat = 47.1, lon = 27.6, radius_nm = 150 }   # acoperă tot Nord-Estul

[sources.adsb.analysis]          # praguri (propuneri; de reglat pe istoricul agregat). Toate opționale.
gnss_enter_ratio = 0.10          # interferență GNSS: > 10 % aeronave cu GPS degradat (banda „roșie” gpsjam)
gnss_exit_ratio = 0.02
gnss_min_n = 4                   # sub 4 aeronave eligibile nu se calculează procentul
maneuver_alert_min = 2           # ≥ 2 aeronave în așteptare / întoarse în 20 min
turnback_min_deg = 150           # întoarcere: schimbare de direcție ≥ 150°
drop_zero_polls = 3              # „0 avioane” confirmat în 3 citiri la rând

# ---------------------------------------------------------------- NOTAM (restricții de spațiu aerian)
# Context oficial, nu alertă în sine. Mesaj în grup DOAR pentru: spațiu aerian închis lângă o țintă
# (orașele din Nord-Est) sau lângă Prut, aeroport Iași/Suceava/Bacău/Chișinău/Bălți închis, restricții
# în spațiul aerian al R. Moldova. Restul (zboruri UAS planificate, zone restricționate de rutină,
# avertizări GNSS) apare doar în /stare. Notă: stratul ROMATSA de mai jos are zonele pentru drone, nu și
# NOTAM-urile de aerodrom; închiderea unui aeroport apare doar dacă o sursă le conține (ex. FAA, oprită).
[[sources.notam]]
name = "romatsa"                 # FIR București (LRBB), inclusiv zonele restricționate de la granița cu MD/UA
source = "romatsa_wfs"           # GeoServer public ROMATSA, fără cheie
enabled = true
interval = 900                   # secunde (minim 300)
max_dist_km = 200                # relevant: zona la ≤ 200 km de Iași (acoperă tot Nord-Estul) …
max_prut_km = 60                 # … sau la ≤ 60 km de Prut
near_km = 60                     # „aproape” (anunț imediat): ≤ 60 km de Iași …
near_prut_km = 15                # … sau ≤ 15 km de Prut, dar nu mai departe de 120 km de Iași
near_prut_max_km = 120
locations = ["LRIA", "LRSV", "LRBC", "LUKK", "LUBL"]   # aeroporturi urmărite (Iași, Suceava, Bacău, Chișinău, Bălți)

[[sources.notam]]
name = "faa"                     # FIR Chișinău (LUUU) – singura sursă găsită care l-ar putea avea; NECONFIRMAT
source = "faa_nms"               # FAA NOTAM Management Service: FAA_NMS_CLIENT_ID și FAA_NMS_CLIENT_SECRET în .env
enabled = false                  # activați după ce primiți credențialele (cerere la FAA, vedeți docs/13)
interval = 900

# ---------------------------------------------------------------- livrare
[notify]
telegram_api = "https://api.telegram.org"
# Canalul public: oprit implicit. Când îl porniți, mesajele publice (doar retransmiteri
# oficiale și încetări) tot așteaptă aprobarea unui operator, dacă auto_publish_official = false.
public_enabled = false
# Publicare automată: DOAR pentru RO-Alert-urile înregistrate de operator (/roalert). Presa cere mereu /aproba.
auto_publish_official = false
telegram_min_interval = 3.1   # secunde între mesaje (limita Telegram ~20/min într-un grup)
dedup_min = 10                # plasă de siguranță: un mesaj intern identic (fără oră) cu unul din ultimele 10 min nu se retrimite; 0 = oprit
# La pornire, botul verifică că grupul intern e PRIVAT (nu canal, fără @nume public) și refuză altfel.
allow_unverified_internal_chat = false
# ntfy.sh fără token e public: refuzat, cu excepția cazului în care puneți true (nerecomandat).
allow_public_ntfy = false
